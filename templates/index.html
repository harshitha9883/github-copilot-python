<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku Master</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="container">
        <header class="app-header">
            <h1>Sudoku Master</h1>
            <div class="header-tools">
                <label for="difficulty-selector">Difficulty:</label>
                <select id="difficulty-selector">
                    <option value="easy">Easy</option>
                    <option value="medium" selected>Medium</option>
                    <option value="hard">Hard</option>
                </select>
                <button id="btn-new-game" class="btn primary">New Game</button>
            </div>
        </header>
        <section class="game-meta">
            <span class="timer-display">Time: <strong id="timer">00:00</strong></span>
            <span id="game-status" class="status-display"></span>
        </section>
        <div id="sudoku-board" class="board-grid"></div>
        <footer class="action-panel">
            <button id="btn-hint" class="btn secondary">Get Hint</button>
            <button id="btn-check" class="btn primary">Check Solution</button>
            <button id="btn-solve" class="btn outline">Reveal Solution</button>
        </footer>
    </main>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
